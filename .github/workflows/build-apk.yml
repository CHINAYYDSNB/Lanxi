name: Build APK + AI Anti-Cheat

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 最小权限原则：只读仓库内容即可
permissions:
  contents: read
  checks: write
  statuses: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: 'stable'

      # ===== 恢复签名密钥（保持你原有的逻辑） =====
      - name: Restore keystore
        continue-on-error: true
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > android/app/lanxi-keystore.jks
            echo "storeFile=lanxi-keystore.jks" > android/app/key.properties
            echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> android/app/key.properties
            echo "keyAlias=lanxi" >> android/app/key.properties
            echo "keyPassword=${{ secrets.KEYSTORE_PASSWORD }}" >> android/app/key.properties
          fi
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Install dependencies
        run: flutter pub get

      # ===== 原有 Analyze（放宽，不卡绿） =====
      - name: Analyze (advisory)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
        continue-on-error: true

      # ==========================================
      #  防骗检查（任何一条红 → 整个 CI 红）
      # ==========================================

      # ==========================================
      #  ⛔ 单人仓库铁律（高于一切）
      #  铁律第2条：含 wip:/fix:/feat: 的 PR 永远禁止合并
      #  铁律第3条：CI 检测到 wip: 却尝试合并 → 直接 Fail
      #  实现方式：让 build 检查变红，分支保护自动拦截合并
      # ==========================================
      - name: "⛔ 铁律 Check 0: Block wip:/fix:/feat: from ever merging"
        run: |
          set -euo pipefail
          echo "⛔ 单人仓库铁律（高于一切）："
          echo "   含 wip:/fix:/feat: 的 PR 永远禁止合并"
          git fetch --no-tags origin main >/dev/null 2>&1 || true
          base=$(git merge-base origin/main HEAD 2>/dev/null || echo "")
          if [ -n "$base" ]; then
            mapfile -t msgs < <(git log --pretty=%s "$base..HEAD")
          else
            mapfile -t msgs < <(git log -1 --pretty=%s)
          fi
          blocked=0
          for m in "${msgs[@]}"; do
            if [[ "$m" =~ ^(wip|fix|feat): ]]; then
              echo "⛔ 铁律违规: 提交 [$m] 使用了禁止合并前缀 wip:/fix:/feat:"
              blocked=1
            fi
          done
          if [ "$blocked" -ne 0 ]; then
            echo ""
            echo "════════════════════════════════"
            echo "  IRON LAW VIOLATION"
            echo "  此 PR 含 wip:/fix:/feat: 提交"
            echo "  CI 直接失败 -> 分支保护拦截合并"
            echo "  （铁律 高于一切，永远禁止合并）"
            echo "════════════════════════════════"
            exit 1
          fi
          echo "✅ 铁律检查通过：未检测到禁止合并前缀"

      - name: "🛡️  Check 1: Ban empty / placeholder implementations"
        run: |
          echo "扫描空实现和TODO..."
          FOUND=0
          # 禁止 UnimplementedError（throw 或任何引用）
          if grep -rn "UnimplementedError" lib/ 2>/dev/null; then
            echo "❌ 发现空实现占位: UnimplementedError"
            FOUND=1
          fi
          # 禁止 // TODO（仅代码行首注释，文档注释里的忽略）
          if grep -rn "^[[:space:]]*//[[:space:]]*TODO" lib/ 2>/dev/null; then
            echo "❌ 发现未完成的 TODO"
            FOUND=1
          fi
          # 禁止单行空函数体
          if grep -rnE "=>[[:space:]]*throw[[:space:]]*UnimplementedError" lib/ 2>/dev/null; then
            echo "❌ 发现空函数体"
            FOUND=1
          fi
          if [ $FOUND -eq 1 ]; then
            echo ""
            echo "════════════════════════════════"
            echo "  AI CHEAT DETECTED: 空实现"
            echo "  这些代码只是壳，功能没做"
            echo "══════════════════════════════"
            exit 1
          fi
          echo "✅ 无空实现 / 无 TODO 占位"

      - name: "🛡️  Check 2: Ban fake tests"
        run: |
          echo "扫描假测试..."
          FOUND=0
          # 禁止 expect(true, true) / expect(false, false)
          if grep -rnE "expect\(true,\s*true\)|expect\(false,\s*false\)" test/ 2>/dev/null; then
            echo "❌ 发现假断言: expect(true, true)"
            FOUND=1
          fi
          # 禁止 expect(1, 1) / expect(0, 0) 这类同值无意义断言
          if grep -rnE "expect\(1,\s*1\)|expect\(0,\s*0\)" test/ 2>/dev/null; then
            echo "❌ 发现假断言: expect(1, 1)"
            FOUND=1
          fi
          # 禁止没有断言的测试文件
          for f in $(find test -name "*_test.dart" 2>/dev/null); do
            if ! grep -qE "expect\(|verify\(" "$f"; then
              echo "❌ 测试文件无断言: $f"
              FOUND=1
            fi
          done
          if [ $FOUND -eq 1 ]; then
            echo ""
            echo "════════════════════════════════"
            echo "  AI CHEAT DETECTED: 假测试"
            echo "  测试没有真正验证任何行为"
            echo "══════════════════════════════"
            exit 1
          fi
          echo "✅ 无假测试"

      - name: "🛡️  Check 3: Require a real behavior test (expect/verify) per Service"
        run: |
          echo "检查 Service 是否有对应的行为测试..."
          FOUND=0
          for service in $(find lib/services -name "*.dart" 2>/dev/null); do
            base=$(basename "$service" .dart)
            test_file=$(find test -name "${base}_test.dart" 2>/dev/null | head -1)
            if [ -z "$test_file" ]; then
              echo "❌ 缺少测试: $service (期望 test/services/${base}_test.dart)"
              FOUND=1
              continue
            fi
            if ! grep -qE "verify\(|expect\(" "$test_file"; then
              echo "❌ 测试无真实断言: $test_file (缺少 verify()/expect() 行为验证)"
              FOUND=1
            fi
          done
          if [ $FOUND -eq 1 ]; then
            echo ""
            echo "════════════════════════════════"
            echo "  AI CHEAT DETECTED: 缺少行为测试"
            echo "  每个 Service 必须有 verify() 验证"
            echo "══════════════════════════════"
            exit 1
          fi
          echo "✅ 所有 Service 都有行为测试"

      - name: "🛡️  Check 4: Ban lying commit messages"
        run: |
          echo "检查 commit message 是否撒谎..."
          COMMIT_MSG=$(git log -1 --pretty=%B)
          echo "最新 commit: $COMMIT_MSG"

          if echo "$COMMIT_MSG" | grep -q "^done:"; then
            if ! git diff --name-only HEAD~1 HEAD 2>/dev/null | grep -q "test/"; then
              echo "❌ done: 但本次 commit 没有改动任何测试文件"
              echo "  要么补测试，要么改前缀为 wip:"
              exit 1
            fi
            if ! echo "$COMMIT_MSG" | grep -qE "analyze|test|verify|验证|passed|0 error"; then
              echo "❌ done: 但 commit body 中没有验证证据"
              echo "  请附上 flutter analyze / flutter test 结果"
              exit 1
            fi
            echo "✅ done: 有测试改动 + 验证证据"
          fi

          if echo "$COMMIT_MSG" | grep -qE "^(fix|feat):"; then
            if echo "$COMMIT_MSG" | grep -qE "完成|搞定|修复|fixed|done|完美"; then
              echo "❌ 禁止 fix:/feat: + 完成表述"
              echo "  改用 wip:/partial:/done: 前缀"
              exit 1
            fi
          fi

          for word in "搞定" "完美解决" "完全修复" "彻底解决" "100%" "肯定可以" "绝对没问题"; do
            if echo "$COMMIT_MSG" | grep -q "$word"; then
              echo "❌ 禁止表述: '$word'"
              exit 1
            fi
          done
          echo "✅ Commit message 通过检查"

      - name: "🛡️  Check 5: Shell function detection (only log/print)"
        run: |
          echo "检查函数是否只有 print/log 没有实际行为..."
          FOUND=0
          for f in $(find lib/services -name "*.dart" 2>/dev/null); do
            if awk '/Future.*\{/{flag=1; count=0; has_real=0} flag{count++} /print|debugPrint/{} /exec|await.*\.run|await.*\.connect|write|query|execute/{has_real=1} /^\}/ {if(flag && count<5 && !has_real){print "❌ 疑似空壳函数: '"$f"'"} flag=0}' "$f"; then
              FOUND=1
            fi
          done
          if [ $FOUND -eq 0 ]; then
            echo "✅ 函数体检查通过"
          fi

      # ===== 跑测试并生成覆盖率 =====
      - name: Run tests (with coverage)
        run: flutter test --coverage
        continue-on-error: false

      # ===== 覆盖率报告（仅展示，不单独卡构建） =====
      - name: Coverage report
        uses: VeryGoodOpenSource/very_good_coverage@v2
        with:
          path: coverage/lcov.info
          min-coverage: 70
        continue-on-error: true

      # ==========================================
      #  🛡️  Check 6: done: 时覆盖率必须达标
      #  铁律第1条：只有功能 100% 完成、行为测试 100% 通过
      #  才能用 done: 前缀；done: 但覆盖率没达标 → 构建失败
      #  （fix: 已被铁律 Check 0 永久禁止合并，无需在此处理）
      # ==========================================
      - name: "🛡️  Check 6: Coverage gate for done:"
        run: |
          MIN_COVERAGE=70
          echo "计算行覆盖率 (来自 coverage/lcov.info)..."
          if [ ! -f coverage/lcov.info ]; then
            echo "❌ 未生成 coverage/lcov.info，测试可能未产出覆盖率"
            exit 1
          fi
          LF=$(awk -F: '/^LF:/ {s+=$2} END {print s+0}' coverage/lcov.info)
          LH=$(awk -F: '/^LH:/ {s+=$2} END {print s+0}' coverage/lcov.info)
          if [ "$LF" -eq 0 ]; then
            COVERAGE=0
          else
            COVERAGE=$(awk "BEGIN{printf \"%.2f\", ($LH/$LF)*100}")
          fi
          echo "📊 行覆盖率: ${COVERAGE}%  (LH=$LH / LF=$LF)  最低要求: ${MIN_COVERAGE}%"

          COMMIT_MSG=$(git log -1 --pretty=%B)
          if echo "$COMMIT_MSG" | grep -qE "^done:"; then
            if awk "BEGIN{exit !($COVERAGE < $MIN_COVERAGE)}"; then
              echo ""
              echo "════════════════════════════════"
              echo "  BUILD FAIL: 覆盖率不达标"
              echo "  铁律第1条：done: 要求覆盖率 >= ${MIN_COVERAGE}%"
              echo "  当前覆盖率: ${COVERAGE}%"
              echo "  请补充行为测试后再提交 done:"
              echo "════════════════════════════════"
              exit 1
            else
              echo "✅ done: 且覆盖率达标 (${COVERAGE}% >= ${MIN_COVERAGE}%)"
            fi
          else
            echo "ℹ️  非 done: 提交（wip:/chore:/fix:/feat: 等），覆盖率仅作记录，不卡构建"
          fi

      # ===== 原有 APK 构建（保留你的一切） =====
      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lanxi-release
          path: build/app/outputs/flutter-apk/app-release.apk

      # ===== 最终判定（人类可读的总结） =====
      - name: Final verdict
        if: always()
        run: |
          echo ""
          echo "╔════════════════════════════════════════╗"
          echo "║         CI VERDICT (最终判定)         ║"
          echo "╠════════════════════════════════════════╣"
          echo "║  ✅ 全绿 = 真完成 → Merge 按钮亮     ║"
          echo "║  ❌ 有红 = 假完成 → AI 继续改        ║"
          echo "║                                        ║"
          echo "║  用户不需要看报告，只看绿灯。         ║"
          echo "╚════════════════════════════════════════╝"
          echo ""
          echo "⛔ 铁律：wip:/fix:/feat: 的 PR 永远合不进去（Merge 按钮必灰）"
          echo ""
          echo "送给 AI 的一句话："
          echo "'编译过 ≠ 功能对，测试绿 ≠ 行为对。"
          echo " 只有删掉实现测试就红的那才是真测试。'"
